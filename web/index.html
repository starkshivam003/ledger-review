<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: three-column review desk (input · live run · decision), dashboard below */
:root{--bg:#f3f4f1;--panel:#fff;--ink:#17201b;--muted:#5f6b64;--line:#dfe3dd;--accent:#1f5f4a;
--ok:#1f7a4d;--hold:#b26a00;--dup:#a3352b;--soft:#eef2ee;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#101512;--panel:#18201c;--ink:#e5ece7;--muted:#97a49c;--line:#2b3530;
--accent:#6cc3a0;--ok:#5fcf8f;--hold:#f0a646;--dup:#f07b6f;--soft:#1f2924}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
padding:16px max(16px,3vw);border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:20px;letter-spacing:-.01em}h1 span{color:var(--muted);font-weight:400;font-size:14px;margin-left:8px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
main{padding:20px max(16px,3vw);display:grid;gap:20px}
.desk{display:grid;grid-template-columns:280px 1fr 1.2fr;gap:20px}
@media(max-width:1000px){.desk{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.ex{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:1px solid var(--line);
border-radius:6px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.ex:hover{border-color:var(--accent)}.ex b{display:block;font-weight:600}.ex small{color:var(--muted)}
.ex .exp{float:right;font-size:11px;font-family:var(--mono);color:var(--muted)}
.drop{display:block;border:1.5px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;margin-top:12px}
.drop:hover{border-color:var(--accent);color:var(--ink)}
button.ghost{font:inherit;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:6px 10px;cursor:pointer}
.stages{list-style:none;margin:0;padding:0}
.stages li{display:grid;grid-template-columns:22px 110px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.stages .dot{width:12px;height:12px;border-radius:50%;margin-top:4px;background:var(--line)}
.pass .dot{background:var(--ok)}.fail .dot{background:var(--hold)}.skip{opacity:.4}
.stages .name{font-family:var(--mono);font-size:12px}.stages .detail{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.badge{display:inline-block;white-space:nowrap;font-weight:600;padding:4px 12px;border-radius:999px;font-size:13px;border:1.5px solid currentColor}
.Approved{color:var(--ok)}.Hold{color:var(--hold)}.Duplicate{color:var(--dup)}
.reason{font-size:17px;margin:12px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:13px}
dt{color:var(--muted)}dd{margin:0;font-family:var(--mono);overflow-wrap:anywhere}
.sub{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.empty{color:var(--muted)}
.pos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.po{border:1px solid var(--line);border-radius:6px;padding:10px}
.po b{font-family:var(--mono)}.bar{height:6px;background:var(--soft);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:6px 8px}
td{white-space:normal;border-bottom:1px solid var(--line);padding:7px 8px;vertical-align:top}
tr.row{cursor:pointer}tr.row td:first-child,tr.row td:nth-child(2){white-space:nowrap}tr.row:hover{background:var(--soft)}
.counts{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.counts b{color:var(--ink);font-family:var(--mono);font-size:16px;margin-right:4px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Ledger Review <span>Invoice → PO → decision</span></h1>
  <button class="ghost" id="reset">Reset demo ledger</button>
</header>
<main>
  <section class="desk">
    <div class="panel">
      <h2>1 · Input</h2>
      <div id="examples"></div>
      <label class="drop" for="file">Upload an invoice PDF<br><small>text-based, under 5 MB</small></label>
      <input type="file" id="file" accept="application/pdf" hidden>
    </div>
    <div class="panel">
      <h2>2 · Live run</h2>
      <ul class="stages" id="stages"></ul>
    </div>
    <div class="panel" id="result"><h2>3 · Decision</h2><p class="empty">Pick an example or upload an invoice to start a run.</p></div>
  </section>
  <section class="panel">
    <h2>Dashboard</h2>
    <div class="pos" id="pos"></div>
    <div class="counts" id="counts"></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Run</th><th>Time</th><th>File</th><th>Vendor · Invoice</th><th>Amount</th><th>Decision</th><th>Reason</th></tr></thead>
      <tbody id="history"></tbody>
    </table></div>
  </section>
</main>
<script src="/ui.js"></script>
</body>
</html>
